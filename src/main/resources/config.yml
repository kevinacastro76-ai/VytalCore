# vytalCore - configuración general
settings:
  prefix: "&8[&#9B5CFF&lvytalCore&8] &r"
  debug: false

menus:
  folder: menus
  open-main-menu-on-item: true

hub:
  enabled: true
  protected-worlds:
    - world
    - lobby
  spawn:
    world: world
    x: 0.5
    y: 80.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  teleport-to-spawn-on-join: false
  clear-inventory-on-join: false
  disable-pvp: true
  disable-fall-damage: true
  disable-hunger: true
  disable-block-break: true
  disable-block-place: true
  disable-item-drop: true
  disable-item-pickup: false
  disable-entity-damage: true
  disable-weather: false
  double-jump:
    enabled: true
    worlds:
      - world
      - lobby
    velocity: 0.8
    cooldown-ms: 1000
  join-items:
    enabled: true
    # Slot 0 = primer espacio de la hotbar
    items:
      menu:
        slot: 0
        material: NETHER_STAR
        name: "&d&lModalidades"
        lore:
          - "&7Clic para abrir el selector"
        action: "open:modalidades"
      players:
        slot: 8
        material: LIME_DYE
        name: "&aJugadores: visibles"
        lore:
          - "&7Clic para ocultar/mostrar"
        action: "toggle-players"
  scoreboard:
    enabled: false
    title: "&#9B5CFF&lZARYVOX"
    lines:
      - "&7&m----------------"
      - "&fJugador: &d%player_name%"
      - "&fRango: &d%luckperms_primary_group_name%"
      - "&fMundo: &d%world%"
      - "&7&m----------------"
      - "&ewww.zaryvox.com"
      
